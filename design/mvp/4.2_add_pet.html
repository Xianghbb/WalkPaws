<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WalkPaws - Add a New Pet</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#4DB6AC",
            "background-light": "#F5F5F5",
            "background-dark": "#101d22",
          },
          fontFamily: {
            "display": ["Plus Jakarta Sans", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }
  </style>
</head>
<body class="font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<!-- TopNavBar -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#E0E0E0] dark:border-b-gray-700 px-10 py-3 bg-white dark:bg-[#1a2c34]">
<div class="flex items-center gap-4 text-[#424242] dark:text-gray-200">
<div class="size-6 text-primary">
<svg fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"></path>
<!-- Simplified paw icon for the logo -->
<path d="M12 1.5A9.5 9.5 0 0 0 2.5 11c0 2.82 1.23 5.35 3.18 7.07.2.18.43.34.67.48a1 1 0 0 0 .65.05c.23-.07.45-.17.65-.3.2-.13.38-.28.55-.45.34-.34.65-.7.9-1.09.25-.39.46-.8.6-1.23.14-.43.2-.88.2-1.33 0-.45-.06-.9-.2-1.33a5.2 5.2 0 0 0-1.7-3.32c-.34-.34-.7-.65-1.09-.9-.39-.25-.8-.46-1.23-.6-.43-.14-.88-.2-1.33-.2s-.9.06-1.33.2c-.43.14-.84.35-1.23.6-.39.25-.75.56-1.09.9A5.2 5.2 0 0 0 4.5 9.67c-.14.43-.2.88-.2 1.33s.06.9.2 1.33c.14.43.35.84.6 1.23.25.39.56.75.9 1.09.34.34.7.65 1.09.9.17.17.35.32.55.45.2.13.42.23.65.3.22.06.45.07.65-.05.24-.14.47-.3.67-.48C19.77 16.35 21.5 13.82 21.5 11A9.5 9.5 0 0 0 12 1.5zm-3.5-1.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm5 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm-2.5 3a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm-5 2.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z" fill="#4DB6AC"></path>
</svg>
</div>
<h2 class="text-[#424242] dark:text-gray-200 text-lg font-bold leading-tight tracking-[-0.015em]">WalkPaws</h2>
</div>
<div class="flex flex-1 justify-end gap-8">
<div class="hidden md:flex items-center gap-9">
<a class="text-[#424242] dark:text-gray-300 text-sm font-medium leading-normal hover:text-primary dark:hover:text-primary" href="#">Home</a>
<a class="text-[#424242] dark:text-gray-300 text-sm font-medium leading-normal hover:text-primary dark:hover:text-primary" href="#">My Pets</a>
<a class="text-[#424242] dark:text-gray-300 text-sm font-medium leading-normal hover:text-primary dark:hover:text-primary" href="#">Find Walkers</a>
<a class="text-[#424242] dark:text-gray-300 text-sm font-medium leading-normal hover:text-primary dark:hover:text-primary" href="#">Messages</a>
</div>
<div class="flex items-center gap-4">
<button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-10 w-10 bg-[#F5F5F5] text-[#424242] dark:bg-gray-700 dark:text-gray-300 hover:bg-primary/20 dark:hover:bg-primary/30">
<span class="material-symbols-outlined">notifications</span>
</button>
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10" data-alt="User profile picture, a person smiling" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDMOzod_hRiJEC34mgOsbOw13dTghtubv78WCdKmVtbwfKECpsz2olFecuxHsKUs0-v1qwUO-Q0El0wHfNUeIRwVp6y1Wpti5Jc_-2jBQb-OMBuTAdiZmdPjlGBYBSRAAvLAUTUuVRK5H2Z_9VlsX0Ve6iq6N3joMzwWL_gwUC8h4JHpkNUvKPPj4IToiio665T0GhEtNc4tHc5I1Lji9ztwGw6yBF_1URIi0Is4xPWvR8Pnhz0EDcQfGi--_IqJgirZacmkCIbLDM");'></div>
</div>
</div>
</header>
<main class="px-4 flex flex-1 justify-center py-10">
<div class="layout-content-container flex flex-col max-w-2xl flex-1">
<!-- PageHeading -->
<div class="flex flex-wrap justify-between gap-3 p-4">
<div class="flex min-w-72 flex-col gap-3">
<p class="text-[#424242] dark:text-gray-200 text-4xl font-black leading-tight tracking-[-0.033em]">Tell Us About Your Pet</p>
<p class="text-gray-500 dark:text-gray-400 text-base font-normal leading-normal">Complete the form below to add a new furry friend to your profile.</p>
</div>
</div>
<div class="flex flex-col gap-6 p-4">
<!-- EmptyState for Photo Upload -->
<div class="flex flex-col items-center gap-6 rounded-xl border-2 border-dashed border-[#E0E0E0] dark:border-gray-600 px-6 py-14 bg-white dark:bg-background-dark">
<div class="flex max-w-[480px] flex-col items-center gap-2">
<p class="text-[#424242] dark:text-gray-200 text-lg font-bold leading-tight tracking-[-0.015em] max-w-[480px] text-center">Upload Photo</p>
<p class="text-gray-500 dark:text-gray-400 text-sm font-normal leading-normal max-w-[480px] text-center">Click or drag to upload a photo. Max file size: 5MB. JPG, PNG.</p>
</div>
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-[#F5F5F5] text-[#424242] dark:bg-gray-700 dark:text-gray-300 text-sm font-bold leading-normal tracking-[0.015em] hover:bg-primary/20 dark:hover:bg-primary/30">
<span class="truncate">Browse Files</span>
</button>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-4">
<!-- TextField for Pet's Name -->
<label class="flex flex-col w-full">
<p class="text-[#424242] dark:text-gray-200 text-base font-medium leading-normal pb-2">Pet's Name</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#424242] dark:text-gray-200 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#E0E0E0] bg-white dark:bg-background-dark dark:border-gray-600 focus:border-primary h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="Enter your pet's name" value=""/>
</label>
<!-- TextFields for Breed and Age -->
<div class="flex flex-col sm:flex-row w-full items-end gap-4">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#424242] dark:text-gray-200 text-base font-medium leading-normal pb-2">Breed</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#424242] dark:text-gray-200 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#E0E0E0] bg-white dark:bg-background-dark dark:border-gray-600 focus:border-primary h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="e.g., Golden Retriever" value=""/>
</label>
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#424242] dark:text-gray-200 text-base font-medium leading-normal pb-2">Age</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#424242] dark:text-gray-200 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#E0E0E0] bg-white dark:bg-background-dark dark:border-gray-600 focus:border-primary h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="e.g., 2 years" value=""/>
</label>
</div>
<!-- Temperament Dropdown -->
<label class="flex flex-col w-full">
<p class="text-[#424242] dark:text-gray-200 text-base font-medium leading-normal pb-2">Temperament</p>
<div class="relative w-full">
<select class="form-select appearance-none flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#424242] dark:text-gray-200 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#E0E0E0] bg-white dark:bg-background-dark dark:border-gray-600 focus:border-primary h-14 p-[15px] text-base font-normal leading-normal">
<option>Calm</option>
<option>Energetic</option>
<option>Playful</option>
<option>Shy</option>
<option>Friendly</option>
<option>Anxious</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500 dark:text-gray-400">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</label>
<!-- Additional Notes Text Area -->
<label class="flex flex-col w-full">
<p class="text-[#424242] dark:text-gray-200 text-base font-medium leading-normal pb-2">Additional Notes (Optional)</p>
<textarea class="form-textarea flex w-full min-w-0 flex-1 resize-y overflow-hidden rounded-lg text-[#424242] dark:text-gray-200 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#E0E0E0] bg-white dark:bg-background-dark dark:border-gray-600 focus:border-primary h-32 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="Anything else we should know? e.g., loves belly rubs, scared of loud noises..."></textarea>
</label>
</div>
<!-- Action Buttons -->
<div class="flex items-center justify-center gap-4 pt-4">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-6 bg-transparent text-[#424242] dark:text-gray-300 text-base font-bold leading-normal tracking-[0.015em] hover:bg-gray-100 dark:hover:bg-gray-700">
<span class="truncate">Cancel</span>
</button>
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-8 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90">
<span class="truncate">Save Pet Profile</span>
</button>
</div>
</div>
</div>
</main>
</div>
</div>
</body></html>
