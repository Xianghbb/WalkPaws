<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Your Account - WalkPaws</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">tailwind.config = {darkMode: "class", theme: {extend: {colors: {primary: "#4DB6AC", "background-light": "#f6f7f7", "background-dark": "#151d1c", "text-light": "#4A4A4A", "text-dark": "#cbd5e1"}, fontFamily: {display: "Plus Jakarta Sans"}, borderRadius: {DEFAULT: "0.5rem", lg: "1rem", xl: "1.5rem", full: "9999px"}}}};</script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden" style='font-family: "Plus Jakarta Sans", "Noto Sans", sans-serif;'>
<div class="layout-container flex h-full grow flex-col">
<div class="px-4 flex flex-1 justify-center items-center py-5">
<div class="layout-content-container flex flex-col w-full max-w-md">
<div class="bg-white dark:bg-background-dark/50 rounded-xl shadow-lg p-8 space-y-6">
<!-- Logo & Page Heading -->
<div class="flex flex-col items-center text-center gap-4">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-4xl">pets</span>
<span class="text-3xl font-bold text-gray-800 dark:text-white">WalkPaws</span>
</div>
<div class="flex flex-col gap-2">
<p class="text-[#0d181b] dark:text-white text-3xl font-black leading-tight tracking-[-0.033em]">Create Your Account</p>
<p class="text-text-light dark:text-text-dark text-base font-normal leading-normal">Join WalkPaws today to connect with local walkers and owners.</p>
</div>
</div>
<!-- Segmented Buttons -->
<div class="flex flex-col gap-2">
<p class="text-[#0d181b] dark:text-white text-base font-medium leading-normal">I am a...</p>
<div class="flex h-12 flex-1 items-center justify-center rounded-xl bg-background-light dark:bg-background-dark p-1">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-background-dark/70 has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-[#0d181b] dark:has-[:checked]:text-white text-text-light dark:text-text-dark text-sm font-medium leading-normal transition-colors duration-200">
<span class="truncate">Pet Owner</span>
<input checked="" class="invisible w-0" name="role-selector" type="radio" value="Pet Owner"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-background-dark/70 has-[:checked]:shadow-[0_0_4px_rgba(0,0,0,0.1)] has-[:checked]:text-[#0d181b] dark:has-[:checked]:text-white text-text-light dark:text-text-dark text-sm font-medium leading-normal transition-colors duration-200">
<span class="truncate">Dog Walker</span>
<input class="invisible w-0" name="role-selector" type="radio" value="Dog Walker"/>
</label>
</div>
</div>
<!-- Text Fields -->
<div class="space-y-4">
<label class="flex flex-col w-full">
<p class="text-[#0d181b] dark:text-white text-base font-medium leading-normal pb-2">Email address</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d181b] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-200 dark:border-gray-700 bg-background-light dark:bg-background-dark/60 focus:border-primary h-12 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="Enter your email" type="email" value=""/>
</label>
<label class="flex flex-col w-full">
<p class="text-[#0d181b] dark:text-white text-base font-medium leading-normal pb-2">Password</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d181b] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-200 dark:border-gray-700 bg-background-light dark:bg-background-dark/60 focus:border-primary h-12 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="Create a password" type="password" value=""/>
</label>
</div>
<!-- Create Account Button -->
<button class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 transition-colors duration-200">
<span class="truncate">Create Account</span>
</button>
<!-- Login Redirect -->
<div class="text-center">
<p class="text-text-light dark:text-text-dark text-sm">
                                Already have an account?
                                <a class="font-semibold text-primary hover:underline" href="#">Log in</a>
</p>
</div>
</div>
</div>
</div>
</div>
</div>
</body></html>
